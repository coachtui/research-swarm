# Railway Nixpacks configuration
# WeasyPrint needs glib/pango/harfbuzz/fontconfig at runtime. The Python here
# is Nix-built, so its dynamic loader ignores /etc/ld.so.cache and system lib
# dirs — apt-installed .so files and ldconfig can never make dlopen work.
# nixLibs provides Nix-built libraries (same glibc as the Python) and puts
# their store paths on LD_LIBRARY_PATH; those dirs contain only these libs,
# so they cannot shadow libc (the vDSO crash noted in start.sh).
# zlib and stdenv.cc.cc.lib are the defaults nixpacks would otherwise add —
# nixLibs replaces the list, so they must be repeated here.
[phases.setup]
nixLibs = [
  "zlib",
  "stdenv.cc.cc.lib",
  "glib",
  "pango",
  "harfbuzz",
  "fontconfig",
  "freetype",
]
# Fonts for text rendering in the PDF, plus /etc/fonts config so the nix
# fontconfig finds them (it reads /etc/fonts/fonts.conf → /usr/share/fonts).
aptPkgs = ["fontconfig", "fonts-dejavu-core"]

# Use uv instead of pip — 10-100x faster installs (Rust-based, parallel downloads).
# `--system` installs into the system Python that nixpacks exposes to the runtime.
# nixpacks' nix Python has no pip module — venv bootstraps its own pip via ensurepip.
# Then install uv (tiny) via venv pip, and use uv for the heavy requirements install.
# /opt/venv/bin is added to PATH by nixpacks at runtime, so all binaries resolve correctly.
[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/pip install uv --quiet",
  "/opt/venv/bin/uv pip install -r requirements.txt",
]
