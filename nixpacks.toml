# Railway Nixpacks configuration
# WeasyPrint uses cffi — no compilation needed, just runtime shared libraries.
# aptPkgs is additive and does not override Nixpacks' auto-detected Python env.
[phases.setup]
aptPkgs = [
  "libglib2.0-0",
  "libpango-1.0-0",
  "libpangoft2-1.0-0",
  "libpangocairo-1.0-0",
  "libcairo2",
  "libharfbuzz0b",
  "libfontconfig1",
  "libfreetype6",
]
# Rebuild ldconfig cache so /etc/ld.so.cache includes the apt-installed libs.
cmds = ["ldconfig"]

# Use uv instead of pip — 10-100x faster installs (Rust-based, parallel downloads).
# `--system` installs into the system Python that nixpacks exposes to the runtime.
# nixpacks' nix Python has no pip module — venv bootstraps its own pip via ensurepip.
# Then install uv (tiny) via venv pip, and use uv for the heavy requirements install.
# /opt/venv/bin is added to PATH by nixpacks at runtime, so all binaries resolve correctly.
[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/pip install uv --quiet",
  "/opt/venv/bin/uv pip install -r requirements.txt",
]
