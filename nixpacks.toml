# Railway Nixpacks configuration
# WeasyPrint uses cffi — no compilation needed, just runtime shared libraries.
# aptPkgs is additive and does not override Nixpacks' auto-detected Python env.
[phases.setup]
aptPkgs = [
  "libglib2.0-0",
  "libpango-1.0-0",
  "libpangoft2-1.0-0",
  "libpangocairo-1.0-0",
  "libcairo2",
  "libharfbuzz0b",
  "libfontconfig1",
  "libfreetype6",
]
# Rebuild ldconfig cache so /etc/ld.so.cache includes the apt-installed libs.
cmds = ["ldconfig"]

# Use uv instead of pip — 10-100x faster installs (Rust-based, parallel downloads).
# `--system` installs into the system Python that nixpacks exposes to the runtime.
[phases.install]
cmds = [
  "python -m pip install uv --quiet",
  "uv pip install -r requirements.txt --system",
]
