[build]
builder = "nixpacks"
buildCommand = "prisma generate --schema=db/schema.prisma"

[deploy]
# 2 workers: one can serve health checks/short requests while the other
# runs a long analysis. Combined with run_in_executor, this prevents
# Railway from marking the service unhealthy during ~4-minute analyses.
startCommand = "uvicorn api.index:app --host 0.0.0.0 --port $PORT --workers 2"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 30
