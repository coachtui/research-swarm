[build]
builder = "nixpacks"
# Generate the Prisma client binary at build time (no DB connection needed).
# Database migrations are applied at start time via start.sh.
buildCommand = "prisma generate --schema=db/schema.prisma"

[deploy]
# start.sh runs in order:
#   1. Log DB target (host + db name — no credentials)
#   2. prisma migrate deploy  ← fails fast if migrations cannot apply
#   3. prisma generate        ← ensures binary matches runtime
#   4. uvicorn (2 workers: one handles health/short requests, one handles analyses)
startCommand = "bash start.sh"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 30
