[build]
builder = "nixpacks"
# Generate the Prisma client binary at build time (no DB connection needed).
# Database migrations are applied at start time via start.sh.
buildCommand = "prisma generate --schema=db/schema.prisma"

[deploy]
# start.sh runs in order:
#   1. Log DB target (host + db name — no credentials)
#   2. prisma migrate deploy  ← fails fast if migrations cannot apply
#   3. uvicorn (2 workers: one handles health/short requests, one handles analyses)
# prisma generate runs at BUILD time (buildCommand) — not here.
# healthcheckTimeout=60 because prisma migrate deploy + Neon cold connect takes ~15-20s,
# leaving insufficient time for uvicorn within a 30s window.
startCommand = "bash start.sh"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 60
