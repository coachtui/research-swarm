[build]
builder = "nixpacks"
# Generate the Prisma client binary at build time (no DB connection needed).
# Database migrations are applied at start time via start.sh.
buildCommand = "python -m prisma generate --schema=db/schema.prisma"

[deploy]
# start.sh: sets LD_LIBRARY_PATH (WeasyPrint) then execs uvicorn directly.
# Migrations are NOT run at startup — apply manually before deploying:
#   railway run python -m prisma migrate deploy --schema=db/schema.prisma
# prisma generate runs at BUILD time (buildCommand) — not at startup.
startCommand = "bash start.sh"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 60
